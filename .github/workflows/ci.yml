name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  ENVIRONMENT: test

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install runtime + dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir -r requirements.txt
          pip install --no-cache-dir -r requirements-dev.txt

      - name: Ruff (lint)
        run: ruff check .

      - name: Ruff (format check)
        run: ruff format --check .

      - name: Mypy (type check)
        run: mypy app/
        # Security: Blocking on type errors prevents missing logic flaws from merging.

      - name: Bandit (security scan)
        run: bandit -r app/ -ll

      - name: pip-audit (dependency vulnerabilities)
        run: pip-audit -r requirements.txt

      - name: Gitleaks (secret scan)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run tests with coverage
        run: pytest --cov=app --cov-report=xml --cov-report=term-missing -v --tb=short
        env:
          DATABASE_URL: sqlite:///./test_ci.db
          CELERY_BROKER_URL: redis://localhost:6379/0
          CELERY_RESULT_BACKEND: redis://localhost:6379/0
          JWT_SECRET: test_secret_key_for_ci
          STORAGE_BACKEND: local
          CELERY_ALWAYS_EAGER: "true"

      - name: Upload backend coverage to Codecov
        if: always()
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4
        with:
          files: backend/coverage.xml
          flags: backend

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit
        # Security: Blocking on type errors prevents missing logic flaws from merging.

      - name: Unit tests with coverage
        run: npm run test:unit -- --coverage

      - name: npm audit
        run: npm audit --omit=dev --audit-level=moderate

      - name: Upload frontend coverage to Codecov
        if: always()
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4
        with:
          directory: frontend/coverage
          flags: frontend

  docker-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      # Push images to GHCR only on pushes to main; PR builds stay local
      # (fork PRs have no packages:write and no access to secrets).
      PUSH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      # GHCR image names must be lowercase; github.repository can contain
      # uppercase (owner/repo), so normalise it once and reuse.
      - name: Compute image prefix
        id: img
        run: echo "prefix=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        if: env.PUSH == 'true'
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build backend image
        id: build-backend
        # Intentional retry pattern: continue on error here, retry in the next step to mitigate transient Docker/network failures.
        continue-on-error: true
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: ./backend
          push: ${{ env.PUSH }}
          tags: |
            ${{ steps.img.outputs.prefix }}/backend:${{ github.sha }}
            ${{ steps.img.outputs.prefix }}/backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Retry backend image build
        if: steps.build-backend.outcome == 'failure'
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: ./backend
          push: ${{ env.PUSH }}
          tags: |
            ${{ steps.img.outputs.prefix }}/backend:${{ github.sha }}
            ${{ steps.img.outputs.prefix }}/backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        id: build-frontend
        # Intentional retry pattern: continue on error here, retry in the next step to mitigate transient Docker/network failures.
        continue-on-error: true
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: ./frontend
          push: ${{ env.PUSH }}
          tags: |
            ${{ steps.img.outputs.prefix }}/frontend:${{ github.sha }}
            ${{ steps.img.outputs.prefix }}/frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Retry frontend image build
        if: steps.build-frontend.outcome == 'failure'
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: ./frontend
          push: ${{ env.PUSH }}
          tags: |
            ${{ steps.img.outputs.prefix }}/frontend:${{ github.sha }}
            ${{ steps.img.outputs.prefix }}/frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-staging:
    needs: [backend, frontend, docker-build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    env:
      STAGING_DEPLOY_WEBHOOK: ${{ secrets.STAGING_DEPLOY_WEBHOOK }}
    steps:
      - name: Compute image prefix
        id: img
        run: echo "prefix=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Gate the deploy on the pushed image booting cleanly in production-mode
      # config: import the app with ENVIRONMENT=staging and all required secrets
      # present. This exercises validate_production_secrets (config.py) so a
      # misconfigured build is caught here, not in front of a customer.
      - name: Staging production-mode config validation
        run: |
          docker pull "${{ steps.img.outputs.prefix }}/backend:${{ github.sha }}"
          docker run --rm \
            -e ENVIRONMENT=staging \
            -e DATABASE_URL=sqlite:///./staging_check.db \
            -e JWT_SECRET=staging_validation_placeholder \
            -e OPENAI_API_KEY=validation \
            -e PINECONE_API_KEY=validation \
            -e STRIPE_SECRET_KEY=validation \
            -e STRIPE_WEBHOOK_SECRET=validation \
            -e AWS_ACCESS_KEY_ID=validation \
            -e AWS_SECRET_ACCESS_KEY=validation \
            -e S3_BUCKET_NAME=validation \
            "${{ steps.img.outputs.prefix }}/backend:${{ github.sha }}" \
            python -c "import app.main; print('Staging production-mode config validation passed')"

      - name: Deploy to staging host
        if: env.STAGING_DEPLOY_WEBHOOK != ''
        run: |
          curl -fsS -X POST "$STAGING_DEPLOY_WEBHOOK" \
            -H 'Content-Type: application/json' \
            -d "{\"ref\":\"${{ github.sha }}\",\"image\":\"${{ steps.img.outputs.prefix }}/backend:${{ github.sha }}\"}"

      - name: Skip deploy (no webhook configured)
        if: env.STAGING_DEPLOY_WEBHOOK == ''
        run: echo "STAGING_DEPLOY_WEBHOOK secret not set — config validation passed, external deploy skipped."

  notify-failure:
    needs: [backend, frontend, docker-build, deploy-staging]
    runs-on: ubuntu-latest
    if: failure()
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
    steps:
      - name: Notify Slack on failure
        if: env.SLACK_WEBHOOK_URL != ''
        run: |
          curl -fsS -X POST -H 'Content-Type: application/json' \
            --data "{\"text\":\":red_circle: EuroGrant CI failed on \`${{ github.ref_name }}\` (${{ github.sha }})\n${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
            "$SLACK_WEBHOOK_URL"

      - name: No Slack webhook configured
        if: env.SLACK_WEBHOOK_URL == ''
        run: echo "CI failed. SLACK_WEBHOOK_URL secret not set — skipping Slack notification."
