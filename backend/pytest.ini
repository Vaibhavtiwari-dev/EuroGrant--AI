[pytest]
testpaths = tests
python_files = test_*.py repro_*.py
asyncio_mode = auto
pythonpath = .
markers =
    live: opt-in tests that hit real external services (OpenAI, Pinecone, Stripe).
        Skipped unless RUN_LIVE_TESTS is set. Never run in the hermetic unit suite.
filterwarnings =
    ignore::pydantic.PydanticDeprecatedSince20
