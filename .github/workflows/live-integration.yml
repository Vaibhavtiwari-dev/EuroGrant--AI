name: Live Integration

# Opt-in tests against real external services (OpenAI, Pinecone, Stripe).
# Kept out of the main CI so the PR path stays hermetic and fast. Runs nightly
# and on demand; each test skips cleanly when its credential is absent, so this
# job is green (all-skipped) until the secrets are configured.

on:
  schedule:
    # 03:17 UTC nightly — off the top of the hour to avoid the scheduler stampede.
    - cron: "17 3 * * *"
  workflow_dispatch:

jobs:
  live-integration:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      RUN_LIVE_TESTS: "1"
      ENVIRONMENT: testing
      DATABASE_URL: sqlite:///./test_live.db
      JWT_SECRET: live_ci_secret
      STORAGE_BACKEND: local
      CELERY_ALWAYS_EAGER: "true"
      # Credentials are `str | None` in config — an empty value (unset secret) is
      # harmless and simply causes the matching test to skip.
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
      STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install runtime + dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir -r requirements.txt
          pip install --no-cache-dir -r requirements-dev.txt

      # Promote only *non-empty* typed config to the env. EMBEDDING_DIMENSION is an
      # int in config.py, so an empty string from an unset secret would fail to
      # parse and crash settings load — guard against that here.
      - name: Configure optional live env
        env:
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          EMBEDDING_MODEL: ${{ secrets.EMBEDDING_MODEL }}
          EMBEDDING_DIMENSION: ${{ secrets.EMBEDDING_DIMENSION }}
          PINECONE_INDEX_NAME: ${{ secrets.PINECONE_INDEX_NAME }}
        run: |
          for var in OPENAI_BASE_URL EMBEDDING_MODEL EMBEDDING_DIMENSION PINECONE_INDEX_NAME; do
            val="${!var}"
            if [ -n "$val" ]; then echo "$var=$val" >> "$GITHUB_ENV"; fi
          done

      - name: Run live integration tests
        run: pytest -m live tests/integration/test_live_services.py -v --tb=short
